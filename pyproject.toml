[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lazzaro"
version = "0.2.5.3"
description = "A scalable memory system for AI agents using graph-based sharding and hierarchical clustering."
readme = "README.md"
authors = [
  { name = "Tobi Balogun", email = "tobitobitobiwhy@gmail.com" },
]
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = [
    "openai>=1.0.0",
    "numpy>=1.21.0",
    "networkx>=2.6.0",
    "matplotlib>=3.5.0",
    "plotly>=5.0.0",
    "fastapi>=0.68.0",
    "uvicorn[standard]>=0.15.0",
    "jinja2>=3.0.0",
    "lancedb>=0.5.0",
    "pyarrow>=10.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
lazzaro-cli = "lazzaro.cli.main:entry_point"
lazzaro-dashboard = "lazzaro.dashboard.api:entry_point"

[project.urls]
Homepage = "https://github.com/thelaycon/lazzaro"

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.html", "*.css", "*.js"]
"lazzaro.dashboard" = ["templates/*.html"]
